version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: classpro-backend
    environment:
      - GO_ENV=production
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/.env:/app/.env:ro
    networks:
      - classpro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  classpro-network:
    driver: bridge
